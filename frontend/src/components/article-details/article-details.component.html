<div class="container" *ngIf="!loading">
  <div class="row header d-flex justify-content-center" *ngIf="article">
    <div class="col-6 title-info">
      <h1>{{ article.title }}</h1>
      <div
        class="author-article-info d-flex justify-content-between align-items-start"
      >
        <div class="d-flex gap-3">
          <img
            class="rounded-circle"
            [src]="
              article.authorImage
                ? article.authorImage
                : '../../assets/images/user-placeholder.jpg'
            "
            alt="Article author."
            role="button"
            [routerLink]="'/' + article.authorSlug"
          />
          <div class="info">
            <a
              class="author-name text-decoration-none"
              [routerLink]="'/' + article.authorSlug"
            >
              {{ article.authorName }}
            </a>
            <div class="date-read-time d-flex align-items-center">
              <p class="date">{{ article.createdAt | formatDate }}</p>
              <p class="mx-1">-</p>
              <p class="read-time">{{ article.readTime }} min read</p>
            </div>
          </div>
        </div>
        <button
          *ngIf="isOwner()"
          class="btn btn-sm btn-outline-dark"
          (click)="editArticle()"
        >
          Edit
        </button>
      </div>
      <div
        class="claps-comments-topics d-flex justify-content-between align-items-center"
      >
        <div class="d-flex gap-4">
          <div *ngIf="currentUser.id != article.author_id" class="d-flex gap-1">
            <button type="button" (click)="onClapClick()" class="clap-btn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                id="Layer_1"
                data-name="Layer 1"
                viewBox="0 0 24 24"
                width="20"
                height="20"
              >
                <path
                  d="M19,15.5v-7c0-.73-.32-1.43-.88-1.9-.56-.48-1.3-.68-2.04-.56-1.19,.19-2.08,1.3-2.08,2.57v1.47l-4.46-4.46c-.45-.45-1.07-.67-1.7-.63-.63,.05-1.21,.38-1.58,.9-.17,.24-.29,.51-.34,.79l-.3-.3c-.45-.45-1.07-.67-1.7-.63-.63,.05-1.21,.38-1.58,.9-.42,.59-.49,1.36-.23,2.04-.61,.06-1.17,.39-1.53,.89-.61,.84-.48,2.06,.3,2.84l.82,.82c-.52,.12-.98,.42-1.29,.86-.61,.84-.48,2.06,.3,2.84l5.13,5.13c1.28,1.28,2.97,1.92,4.65,1.92s3.37-.64,4.65-1.92l1.98-1.98c1.23-1.23,1.9-2.86,1.9-4.6Zm-4.59,5.87c-2.17,2.18-5.71,2.18-7.89,0L1.39,16.23c-.43-.43-.52-1.1-.19-1.55,.21-.29,.51-.46,.85-.49,.33-.03,.66,.09,.9,.33l3.11,3.11,.71-.71L1.56,11.72c-.43-.43-.52-1.1-.19-1.55,.21-.29,.51-.46,.85-.49,.34-.03,.67,.09,.91,.34l5.28,5.28,.71-.71L3.32,8.78c-.43-.43-.52-1.1-.19-1.55,.21-.29,.51-.46,.85-.49,.34-.03,.67,.09,.91,.34l5.86,5.86,.71-.71-4.22-4.22h0c-.43-.43-.52-1.1-.19-1.55,.21-.29,.51-.46,.85-.49,.34-.03,.67,.09,.91,.34l6.17,6.17v-3.89c0-.79,.53-1.47,1.24-1.59,.45-.07,.89,.04,1.23,.34,.34,.29,.53,.7,.53,1.14v7c0,1.45-.59,2.87-1.61,3.89l-1.98,1.98ZM11.56,3.64l-.71-.71L13.15,.65l.71,.71-2.29,2.29Zm-6.17-.04L3.15,1.35l.71-.71,2.25,2.25-.71,.71Zm3.6-.6h-1V0h1V3Zm15,5.55v7c0,1.74-.68,3.37-1.9,4.6l-1.98,1.98c-1.16,1.16-2.66,1.8-4.18,1.91,.21-.17,.41-.35,.6-.54l.73-.74c.78-.27,1.52-.71,2.14-1.33l1.98-1.98c1.02-1.02,1.61-2.44,1.61-3.89v-7c0-.44-.19-.86-.53-1.14-.34-.29-.78-.41-1.23-.34-.15,.02-.3,.08-.43,.15-.1-.32-.23-.63-.39-.92,.21-.1,.43-.18,.66-.21,.73-.12,1.48,.08,2.04,.56,.56,.48,.88,1.17,.88,1.9Z"
                />
              </svg>
            </button>

            <p>
              {{ article.claps }}
            </p>
          </div>
          <div class="d-flex gap-1">
            <img src="../../assets/svg/comment.svg" alt="Comments icon." />
            <p>0</p>
          </div>
        </div>
        <div class="">
          <img src="../../assets/svg/bookmark.svg" alt="Add bookmark icon." />
        </div>
      </div>
      <div
        class="topics-container mt-3"
        *ngIf="article.topics && article.topics.length > 0"
      >
        <div class="d-flex gap-2 flex-wrap">
          <a
            *ngFor="let topic of article.topics"
            class="topic-chip text-decoration-none"
            [routerLink]="'/'"
            [queryParams]="{ topic: topic }"
          >
            {{ topic }}
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="row content">
    <div class="col-6 offset-3" *ngIf="article">
      <img
        [src]="article.image"
        alt="Article image"
        class="img-fluid mb-4"
        *ngIf="article.image"
      />
      <div [innerHTML]="article.content"></div>
    </div>
  </div>
</div>
