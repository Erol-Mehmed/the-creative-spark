<header class="header-container d-flex justify-content-between align-items-center border-black border-bottom">
  <h1 class="fs-4 m-0 title" role="button" routerLink="">The Creative Spark</h1>

  <nav class="navigation d-flex gap-2 align-items-center">
    <ng-container *ngIf="!currentUser">
      <button class="btn btn-link fw-medium text-black text-decoration-none" (click)="openModal('signIn')">Sign In</button>
      <button class="btn btn-primary fw-medium" (click)="openModal('getStarted')">Get Started</button>
    </ng-container>

    <ng-container *ngIf="currentUser">
      <button class="btn btn-link fw-medium text-black text-decoration-none" [routerLink]="'/' + currentUser.username">
        {{ currentUser.username }}
      </button>
      <button class="btn btn-link fw-medium text-black text-decoration-none" routerLink="/create">
        Write
      </button>
      <button class="btn btn-outline-dark fw-medium" (click)="openLogoutConfirmation(logoutConfirmModal)">Logout</button>
    </ng-container>
  </nav>
</header>

<ng-template #logoutConfirmModal let-modal>
  <div class="logout-modal">
    <div class="modal-header">
      <h5 class="modal-title">Confirm logout</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      Are you sure you want to logout?
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">Cancel</button>
      <button type="button" class="btn btn-dark" (click)="logout(modal)">Logout</button>
    </div>
  </div>
</ng-template>
